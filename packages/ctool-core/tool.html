<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Ctool</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="X-UA-Compatible" content="IE=edge, chrome=1">
    <link rel="icon" href="./favicon.ico" type="image/x-ico">
    <link rel="dns-prefetch" href="//cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <!--
      首屏启动骨架样式：用外链，不要写成内联样式。
      Tauri 会给 HTML 里每个内联 style 元素打上 nonce，并把 'nonce-xxx' 追加进 CSP 的 style-src；
      而 CSP3 规定 style-src 一旦带 nonce，'unsafe-inline' 就整体失效，Monaco / Element Plus
      在运行时注入的 style 元素和 style 属性会被全部拒绝（JSON 等编辑器因此丢样式）。
      外链样式表不经过 nonce 注入，样式在 JS 执行前就已生效，效果和原来的内联副本一致。
    -->
    <link rel="stylesheet" href="/src/statics/boot.css">
</head>
<body id="root">
<div id="ctool" style="width: 800px;height: 580px;margin: 0 auto;overflow:hidden;">
    <div id="app"></div>
    <div id="ctool-append"></div>
    <!-- 首屏启动骨架：由 src/tool.ts 在首个路由就绪后淡出并移除，无需 JS 即可显示 -->
    <div id="ctool-boot" class="ctool-boot ctool-boot--overlay" role="status" aria-live="polite" aria-label="加载中 / Loading">
        <div class="ctool-boot-top">
            <span class="ctool-boot-chip ctool-boot-chip--strong w-4"></span>
            <span class="ctool-boot-chip w-3"></span>
            <span class="ctool-boot-chip w-5"></span>
            <span class="ctool-boot-chip w-2"></span>
            <span class="ctool-boot-chip w-6"></span>
            <span class="ctool-boot-chip ctool-boot-spacer w-1"></span>
            <span class="ctool-boot-chip w-1"></span>
        </div>
        <div class="ctool-boot-tabs">
            <span class="ctool-boot-chip ctool-boot-chip--strong w-3"></span>
            <span class="ctool-boot-chip w-2"></span>
            <span class="ctool-boot-chip w-4"></span>
            <span class="ctool-boot-chip w-3"></span>
            <span class="ctool-boot-chip w-2"></span>
        </div>
        <div class="ctool-boot-features">
            <span class="ctool-boot-chip ctool-boot-chip--strong w-2"></span>
            <span class="ctool-boot-chip w-3"></span>
        </div>
        <div class="ctool-boot-main">
            <svg class="ctool-boot-logo" viewBox="0 0 1024 1024" aria-hidden="true">
                <path d="M12.8 845.312c0 67.072 56.832 118.272 131.584 118.272h735.232c74.752 0 131.584-51.2 131.584-118.272V335.872H12.8v509.44zM691.2 512c13.312-11.776 30.72-15.36 43.52-4.096l131.584 98.304c7.68 3.584 12.8 11.264 13.312 19.456-1.024 8.192-4.096 16.384-8.704 23.552l-131.584 114.176c-12.8 10.24-30.72 10.24-43.52 0-13.312-11.776-13.312-31.232 0-39.424l105.472-90.624-105.472-82.432c-13.824-11.776-17.92-27.136-4.608-38.912z m-143.872 0c8.704-15.36 26.112-19.456 43.52-11.776 17.408 7.68 22.016 23.552 13.312 39.424l-131.584 212.48c-6.144 8.704-15.872 14.336-26.112 15.36-4.096 0-13.312 0-17.408-4.096-13.312-7.168-22.016-22.528-13.312-38.912l131.584-212.48z m-258.048-7.68c13.312-10.752 32.768-9.216 43.52 3.584 9.728 9.216 10.24 25.088 1.024 34.816-1.536 1.536-3.072 3.072-5.12 4.096l-105.472 78.336 105.472 90.624c10.752 8.192 13.312 23.04 5.12 34.304 0 0 0 0.512-0.512 0.512-1.536 1.536-2.56 3.072-4.608 4.608-12.8 10.24-30.72 10.24-43.52 0L153.6 641.024c-6.144-6.144-9.728-14.848-8.704-23.552 0-3.072 4.096-7.168 13.312-14.848l131.072-98.304zM144.384 60.416c-74.752 0-131.584 51.2-131.584 118.272V296.96h998.4V178.688c0-67.072-56.832-118.272-131.584-118.272H144.384z m88.064 157.696H144.384V138.752h88.064v79.36z m175.104 0H320V138.752h88.064v79.36z m175.616 0H495.616V138.752H583.68v78.848h-0.512z"></path>
            </svg>
            <div class="ctool-boot-line"></div>
            <!-- 12s 后仍没起来：提示仍在加载（纯视觉，启动前拿不到语言设置，不用文案） -->
            <div class="ctool-boot-slow">
                <span class="ctool-boot-chip w-3"></span>
                <span class="ctool-boot-chip w-5"></span>
                <span class="ctool-boot-chip w-2"></span>
            </div>
            <!-- 30s 后：给一个重载入口，纯 CSS 显示，不依赖 JS -->
            <a class="ctool-boot-retry" href="" aria-label="重新加载 / Reload">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20 11a8 8 0 1 0-2.6 6.4"></path>
                    <path d="M20 5v6h-6"></path>
                </svg>
            </a>
        </div>
        <div class="ctool-boot-foot">
            <span class="ctool-boot-chip w-2"></span>
            <span class="ctool-boot-chip ctool-boot-chip--strong w-3"></span>
            <span class="ctool-boot-chip ctool-boot-spacer w-4"></span>
            <span class="ctool-boot-chip w-1"></span>
            <span class="ctool-boot-chip w-1"></span>
        </div>
    </div>
</div>
<script type="module" src="/src/tool.ts"></script>
</body>
</html>
