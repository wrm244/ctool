<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Ctool</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="X-UA-Compatible" content="IE=edge, chrome=1">
    <link rel="icon" href="./favicon.ico" type="image/x-ico">
    <link rel="dns-prefetch" href="//cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <!--
      首屏启动骨架样式：必须是内联的，否则 JS 执行前没有样式可画。
      规则与 src/statics/boot.css 完全一致（去掉了注释），改一处请同步另一处。
      不能改成内联脚本（inline script）：浏览器扩展 Manifest V3 的 CSP 禁止内联脚本，
      所以骨架只依赖内联样式 + 由 tool.ts 负责卸下。
    -->
    <style id="ctool-boot-style">
        /* 样式表加载前的兜底，避免暗色主题白闪、body 默认 8px 外边距导致布局跳动 */
        html { background: #ffffff; }
        body { margin: 0; }

        @media (prefers-color-scheme: dark) { html { background: #242424; } }

        .ctool-boot {
            --ctool-boot-bg: #ffffff;
            --ctool-boot-bar-bg: #f7f7f7;
            --ctool-boot-border: #dcdfe6;
            --ctool-boot-chip: #e9ebef;
            --ctool-boot-chip-strong: #dfe2e7;
            --ctool-boot-primary: #1abc9c;

            box-sizing: border-box;
            display: grid;
            grid-template-rows: 33px 36px 26px minmax(0, 1fr) 33px;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background-color: var(--ctool-boot-bg);
        }

        .ctool-boot--overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
        }

        .ctool-boot--done {
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
        }

        .ctool-boot-top {
            box-sizing: border-box;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0 15px;
            background-color: var(--ctool-boot-bar-bg);
            border-bottom: 1px solid var(--ctool-boot-border);
            overflow: hidden;
        }

        .ctool-boot-tabs {
            position: relative;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 15px 5px;
            overflow: hidden;
        }

        .ctool-boot-tabs::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            width: 45%;
            height: 2px;
            background-color: var(--ctool-boot-primary);
            animation: ctool-boot-slide 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        .ctool-boot-features {
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border-bottom: 1px solid var(--ctool-boot-border);
            overflow: hidden;
        }

        .ctool-boot-main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 0 15px;
            overflow: hidden;
        }

        .ctool-boot-foot {
            box-sizing: border-box;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 15px;
            background-color: var(--ctool-boot-bar-bg);
            border-top: 1px solid var(--ctool-boot-border);
            overflow: hidden;
        }

        .ctool-boot-spacer { margin-left: auto; }

        .ctool-boot-chip {
            display: block;
            flex: none;
            height: 10px;
            border-radius: 3px;
            background-color: var(--ctool-boot-chip);
        }

        .ctool-boot-chip--strong { background-color: var(--ctool-boot-chip-strong); }

        .ctool-boot-chip.w-1 { width: 24px; }
        .ctool-boot-chip.w-2 { width: 34px; }
        .ctool-boot-chip.w-3 { width: 46px; }
        .ctool-boot-chip.w-4 { width: 58px; }
        .ctool-boot-chip.w-5 { width: 74px; }
        .ctool-boot-chip.w-6 { width: 92px; }

        .ctool-boot-logo {
            width: 34px;
            height: 34px;
            color: var(--ctool-boot-primary);
            fill: currentColor;
            animation: ctool-boot-breath 1.8s ease-in-out infinite;
        }

        .ctool-boot-line {
            position: relative;
            width: 132px;
            height: 2px;
            border-radius: 2px;
            background-color: var(--ctool-boot-chip);
            overflow: hidden;
        }

        .ctool-boot-line::after {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            width: 42%;
            border-radius: inherit;
            background-color: var(--ctool-boot-primary);
            animation: ctool-boot-slide 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        .ctool-boot-slow {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            height: 10px;
            opacity: 0;
            animation: ctool-boot-fadein 0.4s ease 12s forwards;
        }

        .ctool-boot-retry {
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            width: 30px;
            height: 30px;
            border: 1px solid var(--ctool-boot-border);
            border-radius: 50%;
            color: var(--ctool-boot-chip-strong);
            opacity: 0;
            animation: ctool-boot-fadein 0.4s ease 30s forwards;
            transition: color 0.15s, border-color 0.15s;
        }

        .ctool-boot-retry:hover {
            border-color: var(--ctool-boot-primary);
            color: var(--ctool-boot-primary);
        }

        .ctool-boot-retry svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @keyframes ctool-boot-slide {
            0% { left: -45%; }
            100% { left: 100%; }
        }

        @keyframes ctool-boot-breath {
            0%, 100% { opacity: 0.45; transform: scale(0.94); }
            50% { opacity: 0.9; transform: scale(1); }
        }

        @keyframes ctool-boot-fadein {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (prefers-color-scheme: dark) {
            .ctool-boot {
                --ctool-boot-bg: #242424;
                --ctool-boot-bar-bg: #333333;
                --ctool-boot-border: #4c4d4f;
                --ctool-boot-chip: #3a3a3a;
                --ctool-boot-chip-strong: #474747;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .ctool-boot-logo,
            .ctool-boot-tabs::after,
            .ctool-boot-line::after {
                animation: none;
            }

            .ctool-boot-tabs::after,
            .ctool-boot-line::after {
                left: 0;
                width: 30%;
            }

            .ctool-boot--done { transition: none; }
        }
    </style>
</head>
<body id="root">
<div id="ctool" style="width: 800px;height: 580px;margin: 0 auto;overflow:hidden;">
    <div id="app"></div>
    <div id="ctool-append"></div>
    <!-- 首屏启动骨架：由 src/tool.ts 在首个路由就绪后淡出并移除，无需 JS 即可显示 -->
    <div id="ctool-boot" class="ctool-boot ctool-boot--overlay" role="status" aria-live="polite" aria-label="加载中 / Loading">
        <div class="ctool-boot-top">
            <span class="ctool-boot-chip ctool-boot-chip--strong w-4"></span>
            <span class="ctool-boot-chip w-3"></span>
            <span class="ctool-boot-chip w-5"></span>
            <span class="ctool-boot-chip w-2"></span>
            <span class="ctool-boot-chip w-6"></span>
            <span class="ctool-boot-chip ctool-boot-spacer w-1"></span>
            <span class="ctool-boot-chip w-1"></span>
        </div>
        <div class="ctool-boot-tabs">
            <span class="ctool-boot-chip ctool-boot-chip--strong w-3"></span>
            <span class="ctool-boot-chip w-2"></span>
            <span class="ctool-boot-chip w-4"></span>
            <span class="ctool-boot-chip w-3"></span>
            <span class="ctool-boot-chip w-2"></span>
        </div>
        <div class="ctool-boot-features">
            <span class="ctool-boot-chip ctool-boot-chip--strong w-2"></span>
            <span class="ctool-boot-chip w-3"></span>
        </div>
        <div class="ctool-boot-main">
            <svg class="ctool-boot-logo" viewBox="0 0 1024 1024" aria-hidden="true">
                <path d="M12.8 845.312c0 67.072 56.832 118.272 131.584 118.272h735.232c74.752 0 131.584-51.2 131.584-118.272V335.872H12.8v509.44zM691.2 512c13.312-11.776 30.72-15.36 43.52-4.096l131.584 98.304c7.68 3.584 12.8 11.264 13.312 19.456-1.024 8.192-4.096 16.384-8.704 23.552l-131.584 114.176c-12.8 10.24-30.72 10.24-43.52 0-13.312-11.776-13.312-31.232 0-39.424l105.472-90.624-105.472-82.432c-13.824-11.776-17.92-27.136-4.608-38.912z m-143.872 0c8.704-15.36 26.112-19.456 43.52-11.776 17.408 7.68 22.016 23.552 13.312 39.424l-131.584 212.48c-6.144 8.704-15.872 14.336-26.112 15.36-4.096 0-13.312 0-17.408-4.096-13.312-7.168-22.016-22.528-13.312-38.912l131.584-212.48z m-258.048-7.68c13.312-10.752 32.768-9.216 43.52 3.584 9.728 9.216 10.24 25.088 1.024 34.816-1.536 1.536-3.072 3.072-5.12 4.096l-105.472 78.336 105.472 90.624c10.752 8.192 13.312 23.04 5.12 34.304 0 0 0 0.512-0.512 0.512-1.536 1.536-2.56 3.072-4.608 4.608-12.8 10.24-30.72 10.24-43.52 0L153.6 641.024c-6.144-6.144-9.728-14.848-8.704-23.552 0-3.072 4.096-7.168 13.312-14.848l131.072-98.304zM144.384 60.416c-74.752 0-131.584 51.2-131.584 118.272V296.96h998.4V178.688c0-67.072-56.832-118.272-131.584-118.272H144.384z m88.064 157.696H144.384V138.752h88.064v79.36z m175.104 0H320V138.752h88.064v79.36z m175.616 0H495.616V138.752H583.68v78.848h-0.512z"></path>
            </svg>
            <div class="ctool-boot-line"></div>
            <!-- 12s 后仍没起来：提示仍在加载（纯视觉，启动前拿不到语言设置，不用文案） -->
            <div class="ctool-boot-slow">
                <span class="ctool-boot-chip w-3"></span>
                <span class="ctool-boot-chip w-5"></span>
                <span class="ctool-boot-chip w-2"></span>
            </div>
            <!-- 30s 后：给一个重载入口，纯 CSS 显示，不依赖 JS -->
            <a class="ctool-boot-retry" href="" aria-label="重新加载 / Reload">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20 11a8 8 0 1 0-2.6 6.4"></path>
                    <path d="M20 5v6h-6"></path>
                </svg>
            </a>
        </div>
        <div class="ctool-boot-foot">
            <span class="ctool-boot-chip w-2"></span>
            <span class="ctool-boot-chip ctool-boot-chip--strong w-3"></span>
            <span class="ctool-boot-chip ctool-boot-spacer w-4"></span>
            <span class="ctool-boot-chip w-1"></span>
            <span class="ctool-boot-chip w-1"></span>
        </div>
    </div>
</div>
<script type="module" src="/src/tool.ts"></script>
</body>
</html>
